<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>なるき</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <main id="app"></main>

  <script src="messages.js?v=3"></script>
  <script>
    const app = document.getElementById("app");
    const root = document.documentElement;
    root.style.setProperty("--main", SITE.color);
    root.style.setProperty("--cover-bg", SITE.bg);
    document.title = SITE.name;

    function esc(text) {
      return String(text).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    // 絵文字だけ行の高さを広げないように包む（手紙の罫線がずれないように）
    function emojiSafe(html) {
      return html.replace(/\p{Extended_Pictographic}(?:\uFE0F|\u200D\p{Extended_Pictographic})*/gu,
        (m) => `<span class="emo">${m}</span>`);
    }

    // 写真が未設定なら灰色の枠を出す
    function photo(src, cls, label = "写真") {
      return src
        ? `<img class="${cls}" src="${esc(src)}" alt="">`
        : `<div class="${cls} ph">${label}</div>`;
    }

    function show(html, screenClass) {
      app.className = screenClass;
      app.innerHTML = html;
      window.scrollTo(0, 0);
    }

    const envelopeHtml = `
      <div class="env">
        <div class="env-back"></div>
        <div class="env-paper"></div>
        <div class="env-front"></div>
        <div class="env-flap"></div>
        <div class="env-seal"></div>
      </div>`;

    /* ① 最初の画面：手紙をタップ */
    function renderCover() {
      show(`
        <section class="screen cover">
          <p class="cover-text">${esc(SITE.name)}さんに<br>メッセージが届いています</p>
          <button class="env-btn" type="button" aria-label="手紙をひらく">
            <span class="ripple" aria-hidden="true"></span>
            ${envelopeHtml}
          </button>
          <p class="tap-hint" aria-hidden="true">
            <svg class="finger" viewBox="0 0 24 24" width="28" height="28"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5a1.5 1.5 0 0 1 3 0V11m0-.5a1.5 1.5 0 0 1 3 0v4.5a6 6 0 0 1-6 6h-.6a6 6 0 0 1-4.7-2.3L4.4 15.6a1.5 1.5 0 0 1 2.3-1.9L9 16" fill="#fff" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>手紙をタップしてね</span>
          </p>
        </section>`, "is-cover");
      app.querySelector(".env-btn").addEventListener("click", renderGame);
    }

    /* ② ミニゲーム：ソフトテニスのラリー */
    function renderGame() {
      const g = SITE.game;
      show(`
        <section class="screen cover">
          <div class="game-card">
            <div class="game-top">
              <button class="skip-btn" type="button">スキップして手紙をひらく</button>
            </div>
            <p class="game-title">${esc(g.title)}</p>
            <p class="game-hud">ラリー <b class="rally">0</b> / ${g.goal}</p>
            <div class="game-wrap">
              <canvas class="court" width="600" height="840" aria-label="テニスコート"></canvas>
              <div class="game-msg">
                <p>指で左右になぞって<br>ラケットを動かそう</p>
                <button class="game-start" type="button">スタート</button>
              </div>
            </div>
            <p class="game-tip">ラケットの端で打つと角度がつくよ</p>
          </div>
        </section>`, "is-cover");

      const canvas = app.querySelector(".court");
      const ctx = canvas.getContext("2d");
      ctx.scale(2, 2); // くっきり表示するため2倍の解像度で描く
      const W = 300, H = 420, EDGE = 14;
      const rallyEl = app.querySelector(".rally");
      const msg = app.querySelector(".game-msg");
      app.querySelector(".skip-btn").addEventListener("click", renderOpening);
      const player = { x: W / 2, y: H - 46, w: g.racket, h: 10 };
      const cpu = { x: W / 2, y: 36, w: 64, h: 10 };
      const ball = { x: W / 2, y: H / 2, vx: 0, vy: 0, r: 7 };
      let state = "ready"; // ready → play → (miss → play) → clear
      let rally = 0, speed = 0, last = 0;

      function showMsg(html) {
        msg.innerHTML = html;
        msg.hidden = false;
      }

      function setVelocity(dirY, angle) {
        ball.vx = Math.sin(angle) * speed;
        ball.vy = dirY * Math.cos(angle) * speed;
      }

      function serve() {
        speed = 280;
        ball.x = cpu.x;
        ball.y = cpu.y + cpu.h + ball.r;
        setVelocity(1, (Math.random() - 0.5) * 0.8);
        msg.hidden = true;
        state = "play";
      }

      function update(dt) {
        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;
        if (ball.x < EDGE + ball.r) { ball.x = EDGE + ball.r; ball.vx = Math.abs(ball.vx); }
        if (ball.x > W - EDGE - ball.r) { ball.x = W - EDGE - ball.r; ball.vx = -Math.abs(ball.vx); }

        // 相手はボールを追いかけて、必ず打ち返してくる
        const target = ball.vy < 0 ? ball.x : W / 2;
        cpu.x += Math.max(-600 * dt, Math.min(600 * dt, target - cpu.x));
        if (ball.vy < 0 && ball.y - ball.r <= cpu.y + cpu.h) {
          ball.y = cpu.y + cpu.h + ball.r;
          setVelocity(1, (Math.random() - 0.5) * 1.4); // 左右に大きく振ってくる
        }

        // 自分のラケットに当たったか
        if (ball.vy > 0 && ball.y + ball.r >= player.y && ball.y - ball.r <= player.y + player.h
            && Math.abs(ball.x - player.x) <= player.w / 2 + ball.r) {
          ball.y = player.y - ball.r;
          speed = Math.min(speed * 1.08, 580);
          const offset = Math.max(-1, Math.min(1, (ball.x - player.x) / (player.w / 2)));
          setVelocity(-1, offset * 0.9);
          rally++;
          rallyEl.textContent = rally;
          rallyEl.classList.remove("bump");
          void rallyEl.offsetWidth;
          rallyEl.classList.add("bump");
          if (rally >= g.goal) {
            state = "clear";
            showMsg(`<p class="game-big">クリア！</p><p>手紙をひらくよ</p>`);
            setTimeout(() => { if (msg.isConnected) renderOpening(); }, 1400); // スキップ済みなら二重にひらかない
          }
        }

        // 取りこぼしたら0回からやり直し
        if (ball.y - ball.r > H) {
          state = "miss";
          rally = 0;
          rallyEl.textContent = 0;
          showMsg(`<p class="game-big">おしい！</p><p>もう一回</p>`);
          setTimeout(serve, 1100);
        }
      }

      function draw() {
        ctx.fillStyle = "#3f8f5a";
        ctx.fillRect(0, 0, W, H);
        ctx.strokeStyle = "rgba(255,255,255,0.9)";
        ctx.lineWidth = 2;
        ctx.strokeRect(EDGE, EDGE, W - EDGE * 2, H - EDGE * 2);
        ctx.beginPath();
        ctx.moveTo(EDGE, H * 0.3); ctx.lineTo(W - EDGE, H * 0.3);
        ctx.moveTo(EDGE, H * 0.7); ctx.lineTo(W - EDGE, H * 0.7);
        ctx.moveTo(W / 2, H * 0.3); ctx.lineTo(W / 2, H * 0.7);
        ctx.stroke();
        // ネット
        ctx.fillStyle = "rgba(255,255,255,0.95)";
        ctx.fillRect(6, H / 2 - 2, W - 12, 4);
        ctx.fillStyle = "rgba(0,0,0,0.15)";
        ctx.fillRect(6, H / 2 + 2, W - 12, 3);

        drawRacket(cpu, "#e9e9e9");
        drawRacket(player, "#f2b84b");

        // ボール（影つき）
        ctx.fillStyle = "rgba(0,0,0,0.2)";
        ctx.beginPath();
        ctx.ellipse(ball.x + 3, ball.y + 5, ball.r, ball.r * 0.6, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fbfbe6";
        ctx.strokeStyle = "#c9cf86";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      function drawRacket(r, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.roundRect(r.x - r.w / 2, r.y, r.w, r.h, r.h / 2);
        ctx.fill();
      }

      function frame(t) {
        if (!canvas.isConnected) return; // 画面が切りかわったら止める
        const dt = Math.min((t - last) / 1000, 0.033);
        last = t;
        if (state === "play") update(dt);
        draw();
        requestAnimationFrame(frame);
      }

      function moveRacket(e) {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) * (W / rect.width);
        const half = player.w / 2;
        player.x = Math.max(EDGE + half - 10, Math.min(W - EDGE - half + 10, x));
      }
      canvas.addEventListener("pointerdown", moveRacket);
      canvas.addEventListener("pointermove", moveRacket);

      app.querySelector(".game-start").addEventListener("click", serve);
      last = performance.now();
      requestAnimationFrame(frame);
    }

    /* ③ 手紙がひらくアニメーション */
    function renderOpening() {
      show(`<section class="screen cover"><div class="opening">${envelopeHtml}</div></section>`, "is-cover");
      requestAnimationFrame(() => requestAnimationFrame(() =>
        app.querySelector(".opening").classList.add("open")));
      setTimeout(renderLetter, 1900);
    }

    /* ④ 手紙 */
    function renderLetter() {
      const l = SITE.letter;
      show(`
        <section class="screen cover">
          <article class="paper">
            <p class="paper-to">${esc(l.to)}</p>
            <div class="paper-body">${emojiSafe(esc(l.body))}</div>
            <p class="paper-from">${esc(l.from)}</p>
            <button class="know-btn" type="button">${esc(SITE.team)}の${esc(SITE.name)}を知る</button>
          </article>
        </section>`, "is-cover");
      app.querySelector(".know-btn").addEventListener("click", renderWorks);
    }

    /* ⑤ 担当・制作物 */
    function renderWorks() {
      const w = SITE.works;
      const cards = w.items.map((item) => {
        const inner = `${photo(item.image, "work-image", "スクリーンショット")}
          <span class="work-title">${esc(item.title)}</span>`;
        if (item.link === "profile") {
          return `<button class="work" type="button" data-profile>${inner}</button>`;
        }
        if (item.link) {
          return `<a class="work" href="${esc(item.link)}" target="_blank" rel="noopener">${inner}</a>`;
        }
        return `<div class="work">${inner}</div>`;
      }).join("");

      show(`
        <section class="works">
          <button class="back-btn" type="button">← 手紙にもどる</button>
          <h2 class="works-label">担当</h2>
          <p class="works-role">${esc(w.role)}</p>
          <h2 class="works-label">制作物</h2>
          <div class="work-list">${cards}</div>
        </section>`, "is-cover");
      app.querySelector(".back-btn").addEventListener("click", renderLetter);
      app.querySelector("[data-profile]")?.addEventListener("click", renderProfile);
    }

    /* ⑥ プロフィール */
    function renderProfile() {
      const p = SITE.profile;
      const rows = p.items.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
      const qa = SITE.qa.map((x, i) => `
        <li class="qa-item ${i % 2 ? "rev" : ""}">
          <p class="qa-q">${esc(x.q)}</p>
          <p class="qa-a">${esc(x.a)}</p>
        </li>`).join("");
      const album = SITE.album.map((src) => photo(src, "album-photo")).join("");

      show(`
        <header class="top-bar">
          <nav>
            <a href="#profile">profile</a>
            <a href="#qa">Q&amp;A</a>
            <a href="#album">album</a>
          </nav>
          <span class="logo">${esc(SITE.logo)}</span>
        </header>

        ${photo(p.photo, "hero", "メイン写真")}

        <section id="profile" class="sec dark">
          <h2 class="sec-title">profile</h2>
          <dl class="profile-table">${rows}</dl>
        </section>

        <section id="qa" class="sec gray">
          <h2 class="sec-title tag">Q&amp;A</h2>
          <ul class="qa-list">${qa}</ul>
        </section>

        <section id="album" class="sec light">
          <h2 class="sec-title">album</h2>
          <div class="album">${album}</div>
        </section>

        <footer class="foot">
          <span>${esc(SITE.logo)}</span>
          <a href="#" class="to-top" aria-label="ページの上へ">▲<br>Top</a>
        </footer>`, "is-profile");

      app.querySelector(".to-top").addEventListener("click", (e) => {
        e.preventDefault();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    }

    renderCover();
  </script>
</body>
</html>
